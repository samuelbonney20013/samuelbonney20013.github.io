project:
  type: website
  output-dir: docs
  resources:
    - files/

description-meta: "Academic website for Samuel Bonney, graduate student in Applied Statistics."
author-meta: "Samuel Bonney"

website:
  title: "Samuel Bonney"
  image: "images/PP.jpeg"
  description: "Personal academic website for research, projects, teaching, and professional activities."
  site-url: "https://samuelbonney20013.github.io"
  repo-url: https://github.com/samuelbonney20013/samuelbonney20013.github.io

  open-graph: true
  twitter-card: true
  draft-mode: unlinked

  navbar:
    background: "#8A1838"
    foreground: "#FFFFFF"
    pinned: true

    left:
      - text: Home
        href: index.qmd

      - text: Research
        menu:
          - text: Research Overview
            href: research.qmd
          - text: Academic Projects
            href: projects.qmd
          - text: Presentations
            href: presentations.qmd

      - text: Experience
        menu:
          - text: Teaching
            href: teaching.qmd
          - text: Leadership & Service
            href: leadership.qmd
          - text: Awards & Honors
            href: awards.qmd

      - text: Contact
        href: contact.qmd

    right:
      - text: CV
        href: files/CV.pdf
        target: _blank

      - icon: github
        href: https://github.com/samuelbonney20013
        aria-label: GitHub

  search:
    location: navbar
    type: textbox

  page-footer:
    left: "Samuel Bonney © 2026"
    center: 'Last updated <script>document.write(new Date(document.lastModified).toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"}))</script>'
    right:
      - icon: github
        href: https://github.com/samuelbonney20013
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css:
      - styles.css
    toc: true
    page-layout: full
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript

execute:
  freeze: auto